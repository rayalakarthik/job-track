<!DOCTYPE html>

<html>

<head>

    <title>Add Job - JobTrack</title>

</head>

<body>

    <header>

        <h1>JobTrack</h1>

        <p>Add a new job application</p>

    </header>


    <nav>

        <a href="index.html">Home</a>

        <a href="login.html">Login</a>

        <a href="register.html">Register</a>

    </nav>


    <main>

        <h2>Add Job Application</h2>


        <form>

            <div>

                <label for="company">
                    Company
                </label>

                <input
                    type="text"
                    id="company"
                    name="company"
                    placeholder="e.g. Microsoft"
                    required
                >

            </div>


            <div>

                <label for="jobTitle">
                    Job Title
                </label>

                <input
                    type="text"
                    id="jobTitle"
                    name="jobTitle"
                    placeholder="e.g. Data Analyst"
                    required
                >

            </div>


            <div>

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="e.g. Chicago, IL"
                >

            </div>


            <div>

                <label for="jobUrl">
                    Job URL
                </label>

                <input
                    type="url"
                    id="jobUrl"
                    name="jobUrl"
                    placeholder="https://company.com/job"
                >

            </div>


            <div>

                <label for="salary">
                    Salary
                </label>

                <input
                    type="number"
                    id="salary"
                    name="salary"
                    placeholder="e.g. 80000"
                >

            </div>


            <div>

                <label for="applicationDate">
                    Application Date
                </label>

                <input
                    type="date"
                    id="applicationDate"
                    name="applicationDate"
                    required
                >

            </div>


            <div>

                <label for="status">
                    Application Status
                </label>

                <select
                    id="status"
                    name="status"
                    required
                >

                    <option value="Applied">
                        Applied
                    </option>

                    <option value="Interview">
                        Interview
                    </option>

                    <option value="Assessment">
                        Assessment
                    </option>

                    <option value="Rejected">
                        Rejected
                    </option>

                    <option value="Offer">
                        Offer
                    </option>

                    <option value="Accepted">
                        Accepted
                    </option>

                </select>

            </div>


            <div>

                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    name="notes"
                    placeholder="Add notes about this application"
                    rows="5"
                ></textarea>

            </div>


            <button type="submit">
                Add Job
            </button>

        </form>

    </main>


    <footer>

        <p>© 2026 JobTrack</p>

    </footer>

</body>

</html>
