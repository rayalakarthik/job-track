<!DOCTYPE html>

<html>

<head>

    <title>Login - JobTrack</title>

</head>

<body>

    <header>

        <h1>JobTrack</h1>

        <p>Login to your account</p>

    </header>


    <main>

        <h2>Login</h2>

        <form>

            <div>

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div>

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>
            <p>
            Don't have an account?
            <a href="register.html">Create one</a>
            </p>

        </form>

    </main>


    <footer>

        <p>© 2026 JobTrack</p>

    </footer>

</body>

</html>
