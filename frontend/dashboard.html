<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | JobTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>JobTrack</h1>
        <p>Track your job search progress</p>
    </header>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="jobs.html">My Jobs</a>
        <a href="add-job.html">Add Job</a>
        <a href="index.html">Logout</a>
    </nav>

    <main>
        <section>
            <h2>Dashboard</h2>

            <div class="stats">
                <div class="stat">
                    <h3>Total</h3>
                    <span id="total-jobs">0</span>
                </div>

                <div class="stat">
                    <h3>Applied</h3>
                    <span id="applied-jobs">0</span>
                </div>

                <div class="stat">
                    <h3>Interviews</h3>
                    <span id="interview-jobs">0</span>
                </div>

                <div class="stat">
                    <h3>Offers</h3>
                    <span id="offer-jobs">0</span>
                </div>

                <div class="stat">
                    <h3>Rejected</h3>
                    <span id="rejected-jobs">0</span>
                </div>
            </div>
        </section>
    </main>

    <footer>© 2026 JobTrack</footer>

    <script src="script.js"></script>
</body>
</html>
