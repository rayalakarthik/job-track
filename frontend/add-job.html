<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Job | JobTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>JobTrack</h1>
    <p>Track your job applications</p>
</header>

<nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="jobs.html">My Jobs</a>
    <a href="add-job.html">Add Job</a>
    <a href="index.html">Logout</a>
</nav>

<main>

    <section class="form-section">

        <h2>Add Job</h2>

        <form id="job-form">

            <label for="company">Company</label>
            <input id="company" required>

            <label for="jobTitle">Job Title</label>
            <input id="jobTitle" required>

            <label for="location">Location</label>
            <input id="location">

            <label for="jobUrl">Job URL</label>
            <input id="jobUrl" type="url">

            <label for="salary">Salary</label>
            <input id="salary" type="number">

            <label for="applicationDate">Application Date</label>
            <input id="applicationDate" type="date" required>

            <label for="status">Status</label>

            <select id="status" required>
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Assessment">Assessment</option>
                <option value="Rejected">Rejected</option>
                <option value="Offer">Offer</option>
                <option value="Accepted">Accepted</option>
            </select>

            <label for="notes">Notes</label>
            <textarea id="notes" rows="4"></textarea>

            <button type="submit">Add Job</button>

        </form>

    </section>

</main>

<footer>
    © 2026 JobTrack
</footer>

<script src="script.js"></script>

<script>
    requireLogin();
</script>

</body>
</html>
