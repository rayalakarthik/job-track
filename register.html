<!DOCTYPE html>

<html>

<head>

    <title>Create Account - JobTrack</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>JobTrack</h1>

        <p>Create your account</p>

    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>

    <main>

        <h2>Register</h2>


        <form>

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button type="submit" class="form-button">
                Create Account
            </button>
            <p>
            Already have an account?
            <a href="login.html">Login</a>
            </p>

        </form>

    </main>


    <footer>

        <p>© 2026 JobTrack</p>

    </footer>

</body>

</html>
